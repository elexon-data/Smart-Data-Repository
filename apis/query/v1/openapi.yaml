tags:
  - name: Query
components:
  schemas:
    ApiMajorVersion:
      type: string
      pattern: ^[1-9][0-9]*$
      description: Numeric API major version; route templates supply the v prefix.
      example: "1"
    JobSubmitResponse:
      type: object
      required:
        - jobId
        - pollUrl
      properties:
        jobId:
          type: string
          description: Unique identifier for this query job.
        pollUrl:
          type: string
          format: uri
          description: URL to poll for job status updates.
        estimatedCompletionTime:
          type: string
          format: date-time
          description: Estimated completion time (optional).
      description: Response when a query job is successfully submitted.
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type.
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server.
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem.
      description: RFC 7807 Problem Details for HTTP APIs error response.
    AggregatedAnnualEstimateJobRequest:
      type: object
      required:
        - mpanCores
      properties:
        mpanCores:
          allOf:
            - $ref: "#/components/schemas/MpanCoreCsv"
          description: Comma-separated list of at least six distinct 13-digit MPAN Cores.
      description: Request body for an asynchronous aggregated annual estimates export.
    MpanCoreCsv:
      type: string
      description: A comma-separated list of MPAN Cores used by aggregate dataset query contracts.
    AggregatedAnnualEstimateJobStatus:
      type: object
      required:
        - jobId
        - status
      properties:
        jobId:
          type: string
          description: The query job identifier.
        status:
          type: string
          description: Current query job state.
        output:
          type: object
          additionalProperties: {}
          description: Export metadata when the job has completed.
        error:
          type: string
          description: Error details when the job has failed.
        downloadUrl:
          type: string
          description: Relative URL for downloading completed results.
      description: Public status returned while an asynchronous aggregated annual estimates export is running.
    AggregatedAnnualEstimateResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AggregatedAnnualEstimateRecord"
          description: The aggregate result, empty when fewer than six MPANs contribute.
      description: Response envelope returned by the synchronous aggregated annual estimates endpoint.
    AggregatedAnnualEstimateRecord:
      type: object
      required:
        - mpan_cores
        - estimated_annual_consumption_kwh
      properties:
        mpan_cores:
          type: string
          description: The MPAN cores included in the aggregate result.
        estimated_annual_consumption_kwh:
          type: number
          format: decimal
          description: Estimated annual consumption in kWh.
      description: A single aggregated annual estimate result for the requested MPAN cohort.
    Ds22SettlementDate:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T00:00:00(\.[0-9]+)?Z?)?$
    QualityIndicatorCsv:
      type: string
      description: Comma-separated quality indicator values used to filter aggregated consumption and generation for multiple
        meters.
    EnergyDirectionCsv:
      type: string
      description: Comma-separated energy direction values used to filter aggregated consumption and generation for multiple meters.
    Ds22DailyRecord:
      type: object
      required:
        - settlementDate
        - energyDirection
        - spqi
        - mpanCores
        - totalConsumptionKwh
      properties:
        settlementDate:
          type: string
          format: date
        energyDirection:
          type: string
        spqi:
          type: string
        mpanCores:
          type: string
        totalConsumptionKwh:
          type: number
          format: decimal
    PaginationMetadata:
      type: object
      required:
        - offset
        - limit
        - total
        - hasMore
      properties:
        offset:
          type: integer
          format: int32
          description: Number of items skipped before this page.
        limit:
          type: integer
          format: int32
          description: Maximum number of items requested for this page.
        total:
          type: integer
          format: int64
          description: Total number of matching items across all pages.
        hasMore:
          type: boolean
          description: Indicates whether additional items exist beyond this page.
      description: Common pagination metadata for all paginated responses.
    ResponseMetadata:
      type: object
      required:
        - apiVersion
        - timestamp
      properties:
        apiVersion:
          type: string
          description: API version that processed this request.
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the response was generated.
        processingTimeMs:
          type: integer
          format: int32
          description: Server processing time in milliseconds.
        requestId:
          type: string
          description: Unique request identifier for tracing and support.
      description: Request metadata providing context about the API response.
    Link:
      type: object
      required:
        - rel
        - href
      properties:
        rel:
          type: string
          description: Link relation type (e.g., self, next, prev, first, last).
        href:
          type: string
          format: uri
          description: |-
            Target URI for this link.

            When the API is behind Azure API Management (APIM), the backend must generate
            links using the public APIM URL, not the internal backend URL. Implementation options:
            1. Use X-Forwarded-Host and X-Forwarded-Proto headers passed by APIM
            2. Use relative URLs (e.g., /catalog/v1/datasets?offset=100)
            3. Configure the public base URL in application settings
        method:
          type: string
          description: Optional HTTP method for this link (defaults to GET).
        title:
          type: string
          description: Optional human-readable title for this link.
      description: HATEOAS link for navigation and related resources.
    Ds22HalfHourlyRecord:
      type: object
      required:
        - settlementDate
        - settlementPeriod
        - spqi
        - energyDirection
        - mpanCores
        - totalConsumptionKwh
      properties:
        settlementDate:
          type: string
          format: date
        settlementPeriod:
          type: string
          description: Settlement-period time range, for example 1030 - 1100.
        spqi:
          type: string
        energyDirection:
          type: string
        mpanCores:
          type: string
        totalConsumptionKwh:
          type: number
          format: decimal
    Ds22MonthlyRecord:
      type: object
      required:
        - settlementDate
        - energyDirection
        - spqi
        - mpanCores
        - totalConsumptionKwh
      properties:
        settlementDate:
          type: string
          description: Settlement month formatted as yyyy-MM, as shown in the Excel response.
        energyDirection:
          type: string
        spqi:
          type: string
        mpanCores:
          type: string
        totalConsumptionKwh:
          type: number
          format: decimal
    GspGroupId:
      type: string
      pattern: ^_[A-HJ-NP]$
      description: "Grid Supply Point group identifier. Examples: _A, _B, _P."
    QualityIndicator:
      type: string
      enum:
        - A
        - E
        - ANY
      description: Canonical quality indicator values used by aggregate query APIs.
    EnergyDirection:
      type: string
      enum:
        - AI
        - AE
        - ANY
      description: Canonical energy direction values used by query APIs.
    Ds21DailyGspGroupConsumptionRecord:
      type: object
      required:
        - gspGroupId
        - settlementDate
        - spqi
        - energyDirection
        - totalConsumptionKwh
      properties:
        gspGroupId:
          type: string
        settlementDate:
          type: string
          format: date
        spqi:
          type: string
        energyDirection:
          type: string
        totalConsumptionKwh:
          type: number
          format: decimal
      description: Daily GSP group consumption result.
    QueryJobStatusResponse:
      type: object
      required:
        - jobId
        - status
        - output
        - error
        - downloadUrl
      properties:
        jobId:
          type: string
          description: The query-job identifier.
        status:
          type: string
          description: Current query-job lifecycle status.
        output:
          type: object
          allOf:
            - $ref: "#/components/schemas/QueryJobStatusOutput"
          nullable: true
          description: Output metadata, available after successful completion.
        error:
          type: object
          allOf:
            - $ref: "#/components/schemas/QueryJobError"
          nullable: true
