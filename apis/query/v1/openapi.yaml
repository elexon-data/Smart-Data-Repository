  /api/query/v{version}/ds14/daily/download:
    get:
      operationId: DS14_downloadNumberOfMetersByGspDaily
      summary: Download daily GSP meter counts
      description: |-
        Download daily GSP meter counts as streaming CSV or JSON Lines.

        Returns the full result set as a streaming download without pagination.
        Accepts the same filter parameters as the paginated endpoint but streams
        all matching records. Default format is CSV.
      parameters:
