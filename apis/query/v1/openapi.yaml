openapi: 3.0.0
info:
  title: SDR Query API
  version: 1.0.0
  description: Latest approved API contract. Inclusion does not confirm production availability. Check the developer
    portal for release and availability information.
  license:
    name: Proprietary
    url: https://www.elexon.co.uk/terms
servers:
  - url: https://api.elexon.co.uk
    description: Production
    variables: {}
paths:
  /api/query/v{version}/QueryJob:
    post:
      operationId: DS20_submitAggregatedAnnualEstimatesJob
      summary: Submit aggregated annual estimates export
      description: |-
        Submit an asynchronous DS20 export.

        The response contains a job identifier and a URL for polling its status.
      parameters:
        - name: version
          in: path
          required: true
          description: API version.
          schema:
            $ref: "#/components/schemas/ApiMajorVersion"
      responses:
        "202":
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSubmitResponse"
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Access is unauthorized.
        "403":
          description: Access is forbidden.
      tags:
        - Query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AggregatedAnnualEstimateJobRequest"
        description: DS20 MPAN cohort request.
      security:
        - OAuth2Auth:
            - api://sdr-api/level-2
  /api/query/v{version}/QueryJob/{jobId}:
    get:
      operationId: DS20_getAggregatedAnnualEstimatesJobStatus
      summary: Get aggregated annual estimates export status
      description: Get the status and download URL for an asynchronous DS20 export.
      parameters:
        - name: version
          in: path
          required: true
          description: API version.
          schema:
            $ref: "#/components/schemas/ApiMajorVersion"
        - name: jobId
          in: path
          required: true
          description: Query job identifier.
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregatedAnnualEstimateJobStatus"
        "401":
          description: Access is unauthorized.
        "403":
          description: Access is forbidden.
        "404":
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
      tags:
        - Query
      security:
        - OAuth2Auth:
            - api://sdr-api/level-2
  /api/query/v{version}/QueryJob/{jobId}/download:
    get:
      operationId: DS20_downloadAggregatedAnnualEstimatesJob
      summary: Download aggregated annual estimates export
      description: Download the CSV result for a completed asynchronous DS20 export.
      parameters:
        - name: version
          in: path
          required: true
          description: API version.
          schema:
            $ref: "#/components/schemas/ApiMajorVersion"
        - name: jobId
          in: path
          required: true
          description: Query job identifier.
          schema:
            type: string
        - $ref: "#/components/parameters/DownloadParams"
      responses:
        "200":
          description: The request has succeeded.
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "401":
          description: Access is unauthorized.
        "403":
          description: Access is forbidden.
        "404":
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
      tags:
        - Query
      security:
        - OAuth2Auth:
            - api://sdr-api/level-2
  /api/query/v{version}/aggregated-annual-estimates:
    get:
      operationId: DS20_getAggregatedAnnualEstimates
      summary: Get aggregated annual estimates
      parameters:
        - name: version
          in: path
          required: true
          description: API version.
          schema:
            $ref: "#/components/schemas/ApiMajorVersion"
        - name: mpanCores
          in: query
          required: true
          description: Comma-separated list of at least six distinct 13-digit MPAN Cores.
          schema:
            $ref: "#/components/schemas/MpanCoreCsv"
          explode: false
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregatedAnnualEstimateResponse"
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Access is unauthorized.
        "403":
          description: Access is forbidden.
        "503":
          description: Service unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "504":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
      tags:
        - Query
      security:
        - OAuth2Auth:
            - api://sdr-api/level-2
  /api/query/v{version}/aggregated-annual-estimates/download:
