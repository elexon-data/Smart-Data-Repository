  /api/query/v{version}/individual-consumption-generation/{jobId}:
    get:
      operationId: DS01_getIndividualConsumptionJobStatus
      summary: Get individual consumption job status
      description: |-
        Poll the status of an individual consumption query job.

        Returns the current job status. When status is "complete", response includes
        the actual dataset results with pagination. When status is "pending",
        client should continue polling. When status is "failed", response includes error
        details via standard ProblemDetails. Returns 410 Gone with job metadata if the
        query results have been purged after retention period (job record still exists).
        Returns 404 Not Found if the job record itself has been purged.
      parameters:
        - name: version
          in: path
          required: true
          description: API version.
          schema:
            $ref: "#/components/schemas/ApiMajorVersion"
        - name: jobId
          in: path
          required: true
          description: Unique job identifier returned by submit operation.
          schema:
            type: string
        - $ref: "#/components/parameters/PaginationParams.offset"
        - $ref: "#/components/parameters/PaginationParams.limit"
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - pagination
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/IndividualConsumptionRecord"
                    description: The data records for the current page.
                  pagination:
                    allOf:
                      - $ref: "#/components/schemas/PaginationMetadata"
                    description: Pagination metadata for this page.
                  meta:
                    allOf:
                      - $ref: "#/components/schemas/ResponseMetadata"
                    description: Request metadata providing context about the response.
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/Link"
                    description: HATEOAS links for navigation.
                description: Paginated response for dataset queries containing items and pagination metadata only.
        "202":
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPendingResponse"
        "401":
          description: Access is unauthorized.
        "403":
          description: Access is forbidden.
        "404":
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "410":
          description: Client error
          content:
            application/json:
