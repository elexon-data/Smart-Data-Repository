openapi: 3.0.0
info:
  title: SDR Query API
  version: 1.0.0
  description: Latest approved API contract. Inclusion does not confirm production availability. Check the developer
    portal for release and availability information.
  license:
    name: Proprietary
    url: https://www.elexon.co.uk/terms
servers:
  - url: https://sdr.elexon.co.uk
    description: Production
    variables: {}
  - url: https://stgi.sdr.elexon.co.uk
    description: Staging
    variables: {}
paths:
  /api/query/v{version}/QueryJob:
    post:
      operationId: DS20_submitAggregatedAnnualEstimatesJob
      summary: Submit aggregated annual estimates export
      description: |-
        Submit an asynchronous aggregated annual estimates export.

        The response contains a job identifier and a URL for polling its status.
      parameters:
        - name: version
          in: path
          required: true
          description: API version.
          schema:
            $ref: "#/components/schemas/ApiMajorVersion"
      responses:
        "202":
          description: The request has been accepted for processing, but processing has not yet completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSubmitResponse"
              example:
                jobId: 123e4567-e89b-12d3-a456-426614174000
                pollUrl: https://sdr.elexon.co.uk/api/query/v1/aggregated-annual-estimates/123e4567-e89b-12d3-a456-426614174000
        "400":
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: Access is unauthorized.
        "403":
          description: Access is forbidden.
      tags:
        - Query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AggregatedAnnualEstimateJobRequest"
        description: Aggregated annual estimates MPAN cohort request.
      security:
        - OAuth2Auth:
            - api://sdr-api/level-2
  /api/query/v{version}/QueryJob/{jobId}:
    get:
      operationId: DS20_getAggregatedAnnualEstimatesJobStatus
      summary: Get aggregated annual estimates export status
      description: Get the status and download URL for an asynchronous aggregated annual estimates export.
      parameters:
        - name: version
          in: path
          required: true
          description: API version.
          schema:
            $ref: "#/components/schemas/ApiMajorVersion"
        - name: jobId
          in: path
          required: true
          description: Query job identifier.
          schema:
            type: string
      responses:
        "200":
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregatedAnnualEstimateJobStatus"
        "401":
          description: Access is unauthorized.
        "403":
          description: Access is forbidden.
        "404":
          description: The server cannot find the requested resource.
