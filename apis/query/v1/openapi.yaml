          required: true
          description: The dataset domain (e.g. settlement, generation).
          schema:
            type: string
        - name: dataset
          in: path
          required: true
          description: The dataset identifier (e.g. ds14).
          schema:
            type: string
        - name: offset
          in: query
          required: false
          description: Number of rows to skip for pagination.
          schema:
            type: integer
            format: int32
          explode: false
        - name: limit
          in: query
          required: false
          description: Maximum number of rows to return (default 100).
          schema:
            type: integer
            format: int32
          explode: false
        - name: sortBy
          in: query
          required: false
          description: Field to sort rows by.
          schema:
            type: string
          explode: false
        - name: sortOrder
          in: query
          required: false
          description: Sort direction — asc or desc (default asc).
          schema:
            type: string
          explode: false
      responses:
