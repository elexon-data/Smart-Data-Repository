      parameters:
        - name: version
          in: path
          required: true
          description: API version.
          schema:
            $ref: "#/components/schemas/ApiMajorVersion"
        - name: mpanCores
          in: query
          required: true
          description: Comma-separated list of at least six distinct 13-digit MPAN Cores.
          schema:
            $ref: "#/components/schemas/MpanCoreCsv"
          explode: false
      responses:
        "200":
