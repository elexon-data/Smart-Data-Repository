  /api/query/v{version}/{domain}/{dataset}:
    get:
      operationId: QueryRoutes_executeDatasetQuery
      summary: Execute generic query (deprecated)
      description: |-
        DEPRECATED: Execute a generic parameterized query.
        Use specific dataset query routes instead (e.g., getIndividualConsumption).
        This route is retained for backward compatibility only.
      parameters:
        - name: version
          in: path
          required: true
